<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title></title>
</head>
<body>
	<h2>Place Picsum</h2>

	<place-picsum></place-picsum>
	
	<hr/>

	<place-picsum width="700" height="400"></place-picsum>

<script>
class PlacePicsum extends HTMLElement {
	constructor() {
		super();

		let width = 250;
		let height = 250;

		if(this.hasAttribute('width')) width = this.getAttribute('width');
		if(this.hasAttribute('height')) height = this.getAttribute('height');

		this.innerHTML = `<img src="https://picsum.photos/${width}/${height}">`;

	}

}

customElements.define('place-picsum', PlacePicsum);
</script>
</body>
</html>
